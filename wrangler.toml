name = "query"
main = "src/worker.ts"
compatibility_date = "2026-10-12"
# Blocks same-zone fetches when the MCP OAuth server loads Client ID Metadata Documents (SSRF protection)
compatibility_flags = ["global_fetch_strictly_public"]

[observability]
enabled = true

# Per-IP rate limit (60 requests / 60s). Remove to disable.
# DOCS: https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# MCP OAuth: storage for clients, grants and tokens. There is no `id` on purpose:
# `wrangler deploy` creates the namespace on the first deploy (the API token needs
# Workers KV Storage: Edit) and reuses it after that. Add an `id` to pin one.
[[kv_namespaces]]
binding = "OAUTH_KV"
