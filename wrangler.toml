name = "query"
main = "src/app.ts"
compatibility_date = "2026-10-12"

[observability]
enabled = true

# Per-IP rate limit (60 requests / 60s). Remove to disable.
# DOCS: https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
