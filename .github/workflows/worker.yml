name: Build and Deploy Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager"
      - uses: pnpm/action-setup@v6
        name: Install pnpm

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm prettier --check "src/**/*.ts"

      - name: Lint
        run: pnpm eslint "src/**/*.ts"

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      # Deploy only. Worker secrets live in Cloudflare (set once with
      # `wrangler secret put`, see README) and persist across deploys.
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
