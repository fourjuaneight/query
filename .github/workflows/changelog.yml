name: Changelog

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  worker:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -v
        env:
          OUTPUT: CHANGELOG.md

      - name: Update Changelog
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: 'chore: Update Changelog.'

      - name: Release metadata
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "date=$(date +'%Y-%m-%d')"
            echo "name=${version}"
            echo "link=${version//./}"
          } >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "${{ steps.meta.outputs.name }}"
          body: "See [Changelog](${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md#${{ steps.meta.outputs.link }}---${{ steps.meta.outputs.date }}) for release notes."
